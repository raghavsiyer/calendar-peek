<!doctype html>
<!-- Same idea as preview.html, for the Gmail popup. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gmail Peek — preview</title>
<style>
  :root { --panel-background: #1c1d22; --panel-color: #ececf1; --panel-border-radius: 12px; --zen-primary-color: #7c9cff; color-scheme: dark; }
  :root.light { --panel-background: #ffffff; --panel-color: #1d1d21; --zen-primary-color: #4f6df5; color-scheme: light; }
  html, body { margin: 0; background: transparent; }
  body { display: flex; align-items: flex-start; justify-content: center; padding: 28px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #gmailpeek-panel {
    display: block; background: var(--panel-background); color: var(--panel-color);
    border-radius: var(--panel-border-radius); overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 0 1px color-mix(in srgb, var(--panel-color) 12%, transparent);
  }
  #gmailpeek-panel .gp-box { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
</style>
</head>
<body>
<div id="mainPopupSet"></div>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get("theme") === "light") document.documentElement.classList.add("light");
  const FIXED_NOW = new Date(2026, 9, 18, 9, 30).getTime();
  Date.now = () => FIXED_NOW;
  const prefs = { "mod.gmailpeek.account": "0", "mod.gmailpeek.max_items": "6" };
  window.Services = {
    prefs: { PREF_STRING: 32, PREF_INT: 64, PREF_BOOL: 128,
      getPrefType: n => (n in prefs ? 32 : 0), getStringPref: n => prefs[n],
      getIntPref: () => 0, getBoolPref: () => false, getChildList: () => [] },
    appinfo: { OS: "Darwin" }, io: { newURI: u => u },
    scriptSecurityManager: { getSystemPrincipal: () => null },
  };
  window.gBrowser = { tabs: [], tabContainer: null };
  const entry = (title, name, summary, agoMin) => `<entry><title>${title}</title><summary>${summary}</summary>
    <link rel="alternate" href="https://mail.google.com/mail?account_id=x&amp;message_id=1&amp;view=conv"/>
    <issued>${new Date(FIXED_NOW - agoMin * 60000).toISOString()}</issued><author><name>${name}</name><email>x@y.z</email></author></entry>`;
  const FEED = `<?xml version="1.0" encoding="UTF-8"?><feed version="0.3" xmlns="http://purl.org/atom/ns#"><title>Gmail - Inbox for raghav@gmail.com</title><fullcount>4</fullcount>
    ${entry("PSTAT 120B HW4 posted", "Canvas", "A new assignment is available in PSTAT 120B: HW4, due Friday at 11:59pm.", 12)}
    ${entry("Security alert", "Google", "A new sign-in on Windows. We noticed a new sign-in to your Google Account on a Windows device.", 95)}
    ${entry("Re: research sync tomorrow", "Ansel", "Sounds good — I'll bring the pose estimation results from the synthetic set.", 300)}
    ${entry("Your Amtrak eTicket", "etickets", "Thank you for your purchase. Your reservation is confirmed.", 1500)}
    </feed>`;
  window.fetch = async () => ({ ok: true, status: 200, url: "https://mail.google.com/mail/u/0/feed/atom",
    headers: { get: () => "text/xml; charset=UTF-8" }, text: async () => FEED });
</script>
<script src="../gmail-peek.uc.js"></script>
<script>
  (async () => {
    while (!window.gmailPeek) await new Promise(r => setTimeout(r, 20));
    const peek = window.gmailPeek;
    const tab = { getAttribute: a => (a === "data-zen-url" ? "https://mail.google.com/mail/u/0/" : null),
      hasAttribute: () => false, pinned: true, linkedBrowser: {} };
    peek.ensurePanel();
    peek.currentTab = tab;
    const cache = await peek.getFeed("0", 0, true, tab);
    peek.render(cache, "0", tab);
    peek.setRefreshing(false);
    document.documentElement.setAttribute("data-ready", "1");
  })();
</script>
</body>
</html>
